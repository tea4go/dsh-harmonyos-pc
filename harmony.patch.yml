# HarmonyOS 适配补丁：禁用依赖原生二进制(node-pty/Koffi)的插件行。
# 鸿蒙设备无法加载原生 ELF/.node 模块，这些行会直接导致 web 启动崩溃。
- id: subprocess
  disabled: true
- id: sandbox
  disabled: true
- id: bash-sandbox
  disabled: true
# ── v0.1.6-alpha.1 新增行 ────────────────────────────────────────────────
# 侧边栏终端(host: dsh-api-terminal-controller / client: ui-sidebar-terminal) 依赖 `subprocess`
# 服务 = @deepseek-ai/dsh-subprocess-local。该包顶层静态 import node-pty(pty 分配) 与
# koffi(FFI execve) 两个原生模块，鸿蒙禁 dlopen 非受信 ELF 且无 openharmony-arm64 预编译包 →
# 模块加载即 "Cannot find the native Koffi module"。宿主/客户端两侧一起禁用，boot 不再留待激活告警。
- id: terminal-controller
  disabled: true
- id: ui-sidebar-terminal
  disabled: true
# ptc-runtime(程序化工具调用运行时) 同时等 subprocess + sandbox，同理禁用。
- id: ptc-runtime
  disabled: true
# permission-presets 已打 HarmonyOS patch：去 bash shell 依赖改用 fs 沙箱 sandboxMode，
# 对话框权限预设(read-only/workspace-write/danger-full-access)恢复可用。
- id: permission
  disabled: false
# auto 目录选择器要解析 bind host / SSH(依赖被禁用的原生能力)；
# 换 browse 变体,纯 JS 文件浏览,不需要原生模块。
- id: directory-picker
  name: '@deepseek-ai/dsh-host-directory-picker-browse'
# research-plugin 的 research 内核 sidecar 是 node 子进程, 在鸿蒙 exec-mmap 限制下
# 无法监听 7412 变健康; 禁用避免 cordis:include 插件树整体加载失败。
- id: research-plugin
  disabled: true
# 插件市场 dsh-market 重新启用(用户要); 无原生依赖+入口无 boot 期网络调用。
- id: dsh-market
  disabled: false

# 委派子代理路由到 Pro（2026-08-17 实测：preset 的 agentOptions 未生效，子代理落回 flash；
# 需在 profile 层按 id 整行替换才生效；headless 与 web 均已实测）。
# 主循环 flash 便宜,复杂子任务 Pro 原生思考,一次做对省往返。
- id: tool-subagent
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
    # 允许主循环按调用选子代理模型（策略见 settings.yaml: subagent-model-selection）
    modelSelectionSettings: true
    agentOptions:
      provider: deepseek-official
      model: deepseek-v4-pro
      maxTokens: 384000
# 挂载 dsh-schedule 定时调度函数插件（随 dsh 基础安装自带）——
# harmony-chat-ops 常驻任务管家预设的 schedule_create/list/delete 依赖它。
- insert:
    - id: schedule
      name: '@deepseek-ai/dsh-schedule'

# 皮肤互斥切换:蒙纳士蓝 · 演示模板(dsh-monash-skin)接管,其余皮肤禁用。
- id: ui-skin-suzume
  disabled: true
- id: whale-girls
  disabled: true
- id: uiskin-theme
  disabled: true
- id: ui-skin-maid-atelier
  disabled: true
- id: ui-skin-manager
  disabled: false
- id: ui-skin-lulu
  disabled: true
- id: ui-skin-monash
  disabled: false
- id: ui-skin-capybara-ruru
  disabled: true
- id: ui-skin-prts
  disabled: true
- id: ui-skin-sky
  disabled: true
- id: ui-skin-lonetrail
  disabled: true
- id: ui-skin-wandering-earth
  disabled: true
- id: ui-skin-moss
  disabled: true
- id: ui-skin-alan-walker
  disabled: true

# v0.1.2-alpha.2: bridge-browser 依赖的 dsh-api-remotes 旧 API(ApiRemoteSessionNotFound)已被官方重设计移除，
# 该浏览器桥暂时禁用；上游桥接插件适配新 API 后可重新启用。
- id: bridge-browser
  disabled: true

# v0.1.3-alpha.2 回归: web-app bundle 新增 open-in-app(host)，其依赖
# dsh-subprocess/dsh-native-command 原生 spawn 能力(鸿蒙不可用); host 不激活会
# 让整个插件树加载失败(did not activate)。client 纯 UI 无 host 路由,随行禁用。
- id: open-in-app
  disabled: true
- id: ui-open-in-app
  disabled: true

# dsh-pet 0.2.6 顶部 import electron 原生绑定(@electron/get/@electron-internal/extract-zip)，
# 鸿蒙 dlopen 失败(EACCES)且无 linux-arm64-musl prebuild → 冷启动插件树加载即崩(watchdog 重启循环)。
# 禁用该行待上游纯 JS 适配；09-06 在跑的 0.2.0 版可正常加载。
- id: pet
  disabled: true

# ── Agent 预设声明（0.2.x 新格式）────────────────────────────────────────────
# 0.2.x 起 `~/.dsh/.agent-presets/` 目录**不再被读取**（见 dsh-agent-preset 自带
# skills/editing-cordis-compositions/SKILL.md：Nothing reads that directory any more）。
# 预设改为 profile patch 里的 `@deepseek-ai/dsh-agent-preset` 声明行；随包自带的
# standard / ptc / minimal / cordis 四个预设分别要 shell、ptc-runtime、pty 终端，
# 这些在鸿蒙上都被上面的补丁禁用 → 挂载即失败 → 新建会话报
# `agent-preset/invalid: tool-bash ... waiting for shell`。
# 这里声明纯 JS 的 harmony-chat 并设为默认，会话才建得起来。
- insert:
    - id: preset-harmony-chat
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: harmony-chat
        name: 鸿蒙对话模式
        description: 纯 JS Agent，无需 Shell/原生二进制，适用于鸿蒙设备。支持文件编辑、网页检索、Skills、计划、目标。
        order: 1
        plugins:
          # ── identity ──────────────────────────────────────────────────────
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are an AI assistant powered by the {{model}} model. Your working directory is {{cwd}}.
                This device cannot run native executables, so shell and subprocess tools are unavailable;
                you work through file editing, web search, skills, and planning instead.
                回答先给结论，保持简洁。避免长篇解释，除非用户明确要求。若任务可一步完成，直接做，不铺张。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          # ── filesystem ────────────────────────────────────────────────────
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          # ── skills ────────────────────────────────────────────────────────
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          # ── goals ─────────────────────────────────────────────────────────
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          # ── plan mode ─────────────────────────────────────────────────────
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                        You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                        Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                        Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                        When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response. If review rejects it, incorporate the feedback and present again.
          # ── compaction ────────────────────────────────────────────────────
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          # ── remaining model-facing rows ───────────────────────────────────
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          # 网页检索：web 服务在 host 平面，fetch 关闭，仅搜索。
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000
# 默认预设指向上面这个（自带四个都跑不起来）。patches 整行替换 config，
# 而 registry 的 Config 只有 default 一个必填键（selectedDefault 是 volatile，自动填），
# 所以只写 default 不会丢东西。
- id: agent-preset-registry
  config:
    default: harmony-chat
